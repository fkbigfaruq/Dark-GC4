<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>upload video // DARK_GC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="chat-wrap">
    <div class="chat-header">
      <div>
        <div class="brand">DARK_GC</div>
        <div class="meta">upload video</div>
      </div>
      <div class="actions">
        <a class="icon-btn" href="{{ url_for('videos_index') }}">back</a>
      </div>
    </div>

    <div class="upload-box">
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <p class="room-desc">
        Drop a video below. You'll get a link — share it in any room. Videos
        auto-delete after {{ ttl_hours }} hours so the database stays light.
        Max size: <b>{{ max_mb }} MB</b>. Allowed: mp4, webm, mov, m4v, ogg.
      </p>
      <form method="post" enctype="multipart/form-data" class="upload-form">
        <input name="title" placeholder="video title (optional)" maxlength="120">
        <input type="file" name="video" accept="video/*" required>
        <button class="btn-primary" type="submit">upload</button>
      </form>
    </div>
  </div>
</body>
</html>
