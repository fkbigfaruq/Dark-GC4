{# In your chat / DM message loop, when rendering a message,
   add the "bot" class and data-bot attribute if it's from the bot. #}

{% for m in messages %}
  <div class="msg
              {% if m.username in ADMIN_USERS %}admin{% endif %}
              {% if m.is_bot %}bot{% endif %}"
       {% if m.is_bot %}data-bot="{{ BOT_NAME }}"{% endif %}>
    <span class="username {% if m.username in ADMIN_USERS %}admin{% endif %}">
      {{ m.username }}
    </span>
    <span class="text">{{ m.text }}</span>
  </div>
{% endfor %}
